name: AutoPost CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        id: tests
        env:
          FLASK_SECRET_KEY: test-secret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: test-password
          SESSION_COOKIE_SECURE: "0"
          DATABASE_URL: "sqlite:///:memory:"
          CREDENTIAL_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          PYTHONPATH: "."
        shell: bash
        run: |
          set +e
          python -m pytest -vv > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

      - name: Enforce test result
        if: always()
        shell: bash
        run: exit ${{ steps.tests.outputs.exit_code }}
