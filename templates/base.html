<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoPost</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#13213c}

</head>
<body>
<nav><strong>AutoPost</strong></nav>
<main>{% block content %}{% endblock %}</main>

</html>
